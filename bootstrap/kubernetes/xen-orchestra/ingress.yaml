---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xen-orchestra
  namespace: xen-orchestra
spec:
  rules:
    - host: xo.cls1.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xen-orchestra
                port:
                  number: 80