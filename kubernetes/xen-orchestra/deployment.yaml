---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xen-orchestra
  namespace: xen-orchestra
  labels:
    app: xen-orchestra
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: xen-orchestra

  template:
    metadata:
      labels:
        app: xen-orchestra

    spec:
      containers:
        - name: xen-orchestra
          image:  ronivay/xen-orchestra:5.211.1
          imagePullPolicy:  Always

          env:
            - name: HTTP_PORT
              value:  "80"
          
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          volumeMounts:
            - name: xo-data
              mountPath:  /var/lib/xo-server

            - name: xo-redis
              mountPath:  /var/lib/redis
          
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          
      volumes:
        - name: xo-data
          persistentVolumeClaim:
            claimName: xo-data
        
        - name: xo-redis
          persistentVolumeClaim:
            claimName: xo-redis