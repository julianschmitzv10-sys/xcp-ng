---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xo-data
  namespace:  xen-orchestra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xo-redis
  namespace: xen-orchestra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi